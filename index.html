<style>
    /* ===== استایل دکمه کشویی ===== */
    .floating-container {
        position: fixed;
        bottom: 20px;
        left: 20px;
        z-index: 1000;
        display: flex;
        flex-direction: row;
        align-items: center;
        font-family: 'Vazirmatn', sans-serif;
        gap: 0;
        direction: ltr;
    }

    /* دکمه اصلی */
    .floating-main-btn {
        background: linear-gradient(135deg, #25D366 0%, #1da851 100%);
        color: #fff;
        border: none;
        border-radius: 50px;
        padding: 14px 20px;
        font-size: 15px;
        font-weight: 700;
        font-family: 'Vazirmatn', sans-serif;
        cursor: pointer;
        box-shadow: 0 6px 25px rgba(37, 211, 102, 0.5);
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
        animation: main-pulse 2.5s infinite;
        position: relative;
        min-width: 150px;
        justify-content: center;
        border-radius: 50px 0 0 50px;
        padding: 14px 20px 14px 24px;
        direction: ltr;
    }

    .floating-main-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 8px 35px rgba(37, 211, 102, 0.6);
    }

    .floating-main-btn .btn-arrow {
        font-size: 14px;
        transition: transform 0.4s ease;
        display: inline-block;
        order: 0;
    }

    .floating-main-btn .btn-text {
        display: flex;
        align-items: center;
        gap: 8px;
        order: 1;
    }

    .floating-main-btn.active .btn-arrow {
        transform: rotate(90deg);
    }

    /* منوی کشویی - باز شدن به سمت راست */
    .floating-menu {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 8px;
        opacity: 0;
        visibility: hidden;
        transform: translateX(-20px);
        transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        margin-left: 0;
        direction: ltr;
    }

    .floating-menu.open {
        opacity: 1;
        visibility: visible;
        transform: translateX(0);
    }

    /* آیتم‌های منو */
    .floating-item {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 12px 20px;
        border-radius: 50px;
        text-decoration: none;
        color: #fff;
        font-weight: 600;
        font-size: 13px;
        font-family: 'Vazirmatn', sans-serif;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        white-space: nowrap;
        border: 2px solid rgba(255,255,255,0.1);
        min-width: 80px;
        justify-content: center;
    }

    .floating-item:hover {
        transform: scale(1.08);
        box-shadow: 0 6px 25px rgba(0, 0, 0, 0.3);
    }

    .floating-item .item-icon {
        font-size: 18px;
    }

    .floating-item .item-text {
        font-size: 13px;
    }

    .call-item {
        background: linear-gradient(135deg, #25D366, #1da851);
        border-radius: 50px 0 0 50px;
    }

    .whatsapp-item {
        background: linear-gradient(135deg, #25D366, #1da851);
        border-radius: 50px;
    }

    .eitaa-item {
        background: linear-gradient(135deg, #1e88e5, #1565c0);
        border-radius: 0 50px 50px 0;
    }

    /* انیمیشن‌ها */
    @keyframes main-pulse {
        0% { box-shadow: 0 6px 25px rgba(37, 211, 102, 0.5); }
        50% { box-shadow: 0 6px 40px rgba(37, 211, 102, 0.8), 0 0 60px rgba(37, 211, 102, 0.2); }
        100% { box-shadow: 0 6px 25px rgba(37, 211, 102, 0.5); }
    }

    /* ===== ریسپانسیو برای موبایل ===== */
    @media (max-width: 768px) {
        .floating-container {
            bottom: 15px;
            left: 10px;
            gap: 0;
        }

        .floating-main-btn {
            padding: 11px 14px;
            font-size: 12px;
            min-width: 100px;
            border-radius: 40px 0 0 40px;
            padding: 11px 14px 11px 18px;
        }

        .floating-main-btn .btn-arrow {
            font-size: 11px;
        }

        .floating-item {
            padding: 10px 12px;
            font-size: 11px;
            min-width: 60px;
        }

        .floating-item .item-icon {
            font-size: 15px;
        }

        .floating-item .item-text {
            font-size: 11px;
        }

        .floating-menu {
            gap: 5px;
        }
    }

    @media (max-width: 480px) {
        .floating-container {
            bottom: 10px;
            left: 5px;
        }

        .floating-main-btn {
            padding: 9px 10px;
            font-size: 10px;
            min-width: 75px;
            border-radius: 30px 0 0 30px;
            padding: 9px 10px 9px 14px;
        }

        .floating-main-btn .btn-arrow {
            font-size: 9px;
        }

        .floating-item {
            padding: 8px 8px;
            font-size: 9px;
            min-width: 45px;
        }

        .floating-item .item-icon {
            font-size: 12px;
        }

        .floating-item .item-text {
            font-size: 9px;
        }

        .floating-menu {
            gap: 3px;
        }

        .call-item {
            border-radius: 30px 0 0 30px;
        }

        .eitaa-item {
            border-radius: 0 30px 30px 0;
        }
    }
</style>

<script>
    // ===== اسکریپت باز و بسته شدن منوی کشویی =====
    document.addEventListener('DOMContentLoaded', function() {
        const toggleBtn = document.getElementById('floatingToggle');
        const menu = document.getElementById('floatingMenu');

        toggleBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            this.classList.toggle('active');
            menu.classList.toggle('open');
        });

        // بستن منو با کلیک روی هر آیتم
        document.querySelectorAll('.floating-item').forEach(item => {
            item.addEventListener('click', function() {
                toggleBtn.classList.remove('active');
                menu.classList.remove('open');
            });
        });

        // بستن منو با کلیک بیرون
        document.addEventListener('click', function(e) {
            const container = document.querySelector('.floating-container');
            if (!container.contains(e.target)) {
                toggleBtn.classList.remove('active');
                menu.classList.remove('open');
            }
        });
    });
</script>
